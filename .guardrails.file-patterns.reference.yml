# Human-readable documentation of effective file-scan defaults in this repository.
# Runtime in consumer checkouts reads only `.guardrails.file-patterns.yml` when present;
# built-in find excludes live in the guardrails scripts, and package policy defaults ship
# in flat YAML files under scripts/config (mirrored under package_policy below).
# Do not require copying this file into consumer repositories.
#
# policy_handler / artifact        implementation (relative to guardrails repo)
# ---------------------------------------------------------------------------
# js_ts / package.json             package_policy.javascript + scripts/checks/domain/package/js_ts.sh
# js_ts / tsconfig.json            same — exact TypeScript project trigger
# js_ts / jsconfig.json            same — exact JavaScript project trigger
# js_ts / package-lock.json        same — cicd_sec_03_audit_js_ts_lock_package_lock
# js_ts / yarn.lock                same — cicd_sec_03_audit_js_ts_lock_yarn
# js_ts / pnpm-lock.yaml           same — cicd_sec_03_audit_js_ts_lock_pnpm
# js_ts / bun.lockb                same — nonempty_file validator
# python / (directory policy)      scripts/config/package_policy.defaults.yml + scripts/lib/package_policy.sh + scripts/checks/domain/package/python.sh — cicd_sec_03_run_python_package_policy
# go / go.mod                      package_policy.go + generic same-directory policy runner
# go / go.sum                      same — nonempty_file validator
# rust / Cargo.toml                scripts/checks/domain/package/rust.sh — cicd_sec_03_audit_rust_cargo_toml
# rust / Cargo.lock                same — cicd_sec_03_audit_rust_cargo_lock
# ruby / Gemfile                   scripts/checks/domain/package/ruby.sh — cicd_sec_03_audit_ruby_gemfile
# ruby / Gemfile.lock              same — cicd_sec_03_audit_ruby_gemfile_lock
# php / composer.json              scripts/checks/domain/package/php.sh — cicd_sec_03_audit_php_composer_json
# php / composer.lock              same — cicd_sec_03_audit_php_composer_lock
# workflows / *.yml, *.yaml       scripts/lib/action_pin_audit.sh — action_pin_scan_file (ecosystem workflows)
# docker / Dockerfile*             scripts/lib/dockerfile_pin_audit.sh — dockerfile_pin_scan_file
# composite-action / action.yml  scripts/lib/action_pin_audit.sh — action_pin_scan_file (ecosystem composite-action)

version: 1
# Mirror of built-in find excludes (consumer overlays add more; they do not replace these).
# tests/test_checks.sh asserts this list stays identical to fp_default_excludes().
# Generic output directory names (build/, dist/, out/) are intentionally absent because
# they frequently hold reviewed source in real repositories.
global_excludes:
  - "*/.git/*"          # version control metadata
  - "*/node_modules/*"  # installed npm/yarn/pnpm dependencies
  - "*/.venv/*"         # Python virtualenv
  - "*/target/*"        # Cargo / Maven build output
  - "*/.next/*"         # Next.js build and dev output
  - "*/.nuxt/*"         # Nuxt build output
  - "*/.output/*"       # Nuxt 3 / Nitro build output
  - "*/.turbo/*"        # Turborepo task cache
  - "*/.cache/*"        # generic tool cache (Parcel, Gatsby, pip, …)
  - "*/__pycache__/*"   # CPython bytecode cache
  - "*/coverage/*"      # generated coverage reports (jest, nyc, pytest-cov)
validation_skip_paths: []

# Mirror of scripts/config/package_policy.defaults.yml (flat document == this key).
# tests/test_checks.sh asserts they stay identical when yq is available.
package_policy:
  python:
    triggers:
      - pyproject.toml
      - requirements.in
      - requirements.txt
      - requirements-dev.in
      - requirements-dev.txt
    satisfiers:
      - requirements.txt
      - requirements-dev.txt
      - poetry.lock
      - uv.lock
    allowed_trigger_combinations:
      - - requirements.in
        - requirements.txt
      - - requirements-dev.in
        - requirements-dev.txt
      - - pyproject.toml
        - requirements.txt
    hash_validators:
      requirements.txt: pip_requirements_txt_hashes
      requirements-dev.txt: pip_requirements_txt_hashes
      poetry.lock: poetry_lock_hashes
      uv.lock: uv_lock_hashes
  # Mirror of scripts/config/package_policy.javascript.defaults.yml.
  javascript:
    triggers:
      - package.json
      - tsconfig.json
      - jsconfig.json
    satisfiers:
      - package-lock.json
      - yarn.lock
      - pnpm-lock.yaml
      - bun.lockb
    allowed_trigger_combinations:
      - - package.json
      - - tsconfig.json
        - package.json
      - - jsconfig.json
        - package.json
    allowed_satisfier_combinations:
      - - package-lock.json
      - - yarn.lock
      - - pnpm-lock.yaml
      - - bun.lockb
    manifest_validator: package_json_exact_specs
    hash_validators:
      package-lock.json: npm_lock_integrity
      yarn.lock: yarn_lock_integrity
      pnpm-lock.yaml: pnpm_lock_integrity
      bun.lockb: nonempty_file
  # Mirror of scripts/config/package_policy.go.defaults.yml.
  go:
    triggers:
      - go.mod
    satisfiers:
      - go.sum
    hash_validators:
      go.sum: nonempty_file

# Minimal overlay examples for consumer repos: see README (Dateiscan-Overlay).
